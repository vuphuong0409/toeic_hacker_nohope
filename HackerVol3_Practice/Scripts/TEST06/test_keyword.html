<!DOCTYPE html>
<html>
<head>
    <title>Test Keyword Feature</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
        .option {
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }
        .option:hover {
            background: #f0f0f0;
        }
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
        .keyword-display {
            font-size: 0.9em;
            margin-top: 8px;
            display: block;
            color: #0d5c2e;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>Test Keyword Feature</h2>
        <p>Click on option (C) to test the keyword display:</p>
        
        <div class="option" onclick="testAnswer('C')">
            <input type="radio" name="test"> (C) The man's kneeling down.
        </div>
        
        <div id="feedback" class="feedback"></div>
    </div>

    <script>
        function testAnswer(answer) {
            var feedback = document.getElementById('feedback');
            var keyword = 'kneeling';
            
            feedback.innerHTML = '✓ Correct!<span class="keyword-display">💡 Key word: <strong>' + keyword + '</strong></span>';
            feedback.classList.add('show', 'correct');
        }
    </script>
</body>
</html>
