<!DOCTYPE html>
<html>
<head>
    <title>Test Keyword Feature</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .test-container {
            background: white;
            padding: 20px;
            border-radius: 8px;
            max-width: 600px;
            margin: 0 auto;
        }
        .option {
            padding: 10px;
            margin: 10px 0;
            border: 2px solid #ddd;
            border-radius: 5px;
            cursor: pointer;
        }
        .option:hover {
            background: #f0f0f0;
        }
        .option label {
            cursor: pointer;
        }
        .feedback {
            margin-top: 15px;
            padding: 15px;
            border-radius: 5px;
            display: none;
        }
        .feedback.show {
            display: block;
        }
        .feedback.correct {
            background: #d4edda;
            color: #155724;
            border: 2px solid #28a745;
        }
    </style>
</head>
<body>
    <div class="test-container">
        <h2>Test Keyword Feature</h2>
        <p>Click on option (C) to test the keyword display:</p>
        
        <div class="option" onclick="testAnswer(this)">
            <input type="radio" name="test"> <label>(C) The man's kneeling down.</label>
        </div>
        
        <div id="feedback" class="feedback"></div>
    </div>

    <script>
        function testAnswer(option) {
            var feedback = document.getElementById('feedback');
            var keyword = 'kneeling';
            var label = option.querySelector('label');
            var answer = label.textContent;
            var start = answer.toLowerCase().indexOf(keyword.toLowerCase());

            if (start !== -1) {
                var end = start + keyword.length;
                var highlighted = document.createElement('strong');
                highlighted.style.color = '#dc3545';
                highlighted.textContent = answer.slice(start, end);
                label.textContent = '';
                label.appendChild(document.createTextNode(answer.slice(0, start)));
                label.appendChild(highlighted);
                label.appendChild(document.createTextNode(answer.slice(end)));
            }

            feedback.textContent = '✓ Correct!';
            feedback.classList.add('show', 'correct');
        }
    </script>
</body>
</html>
