<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Panel - User Management</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
            min-height: 100vh;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 15px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.2);
            overflow: hidden;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px;
            text-align: center;
        }
        
        .header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
        }
        
        .header p {
            font-size: 1.1em;
            opacity: 0.9;
        }
        
        .user-info {
            text-align: right;
            padding: 15px 40px;
            background: #f8f9fa;
            border-bottom: 1px solid #e9ecef;
        }
        
        .user-info span {
            color: #667eea;
            font-weight: 600;
        }
        
        .logout-btn {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            margin-left: 15px;
            transition: all 0.3s;
        }
        
        .logout-btn:hover {
            background: #c0392b;
        }
        
        .back-btn {
            background: #667eea;
            color: white;
            border: none;
            padding: 8px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.9em;
            margin-right: 15px;
            transition: all 0.3s;
            text-decoration: none;
        }
        
        .back-btn:hover {
            background: #5568d3;
        }
        
        .content {
            padding: 40px;
        }
        
        .admin-panel {
            background: #f8f9fa;
            border: 2px solid #667eea;
            border-radius: 12px;
            padding: 25px;
        }
        
        .admin-panel h3 {
            color: #667eea;
            margin-bottom: 20px;
            font-size: 1.5em;
        }
        
        .user-list {
            margin-bottom: 20px;
        }
        
        .user-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: white;
            border-radius: 8px;
            margin-bottom: 10px;
            border: 1px solid #e9ecef;
        }
        
        .user-item-info {
            display: flex;
            align-items: center;
            gap: 15px;
        }
        
        .user-item-info .username {
            font-weight: 600;
            color: #333;
        }
        
        .user-item-info .role {
            padding: 3px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: 600;
        }
        
        .user-item-info .role.admin {
            background: #f39c12;
            color: white;
        }
        
        .user-item-info .role.user {
            background: #667eea;
            color: white;
        }
        
        .btn-delete {
            background: #e74c3c;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.9em;
            transition: all 0.3s;
        }
        
        .btn-delete:hover {
            background: #c0392b;
        }
        
        .add-user-form {
            background: white;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #e9ecef;
        }
        
        .add-user-form h4 {
            color: #667eea;
            margin-bottom: 15px;
        }
        
        .form-row {
            display: flex;
            gap: 15px;
            margin-bottom: 15px;
        }
        
        .form-row .form-group {
            flex: 1;
        }
        
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
            font-size: 0.9em;
        }
        
        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #e9ecef;
            border-radius: 6px;
            font-size: 0.95em;
        }
        
        .btn-add {
            background: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
        }
        
        .btn-add:hover {
            background: #218838;
        }
        
        .footer {
            text-align: center;
            padding: 20px;
            color: #666;
            border-top: 1px solid #e9ecef;
            font-weight: 700;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>👥 Admin Panel</h1>
            <p>User Management</p>
        </div>
        
        <div class="user-info">
            Welcome, <span id="username">Admin</span>
            <a href="index.html" class="back-btn">← Back to Tests</a>
            <button class="logout-btn" onclick="window.logout()">Logout</button>
        </div>
        
        <div class="content">
            <div class="admin-panel">
                <h3>👥 User Management</h3>
                <div class="user-list" id="userList">
                    <!-- Users will be loaded here -->
                </div>
                <div class="add-user-form">
                    <h4>➕ Add New User</h4>
                    <div class="form-row">
                        <div class="form-group">
                            <label>Username</label>
                            <input type="text" id="newUsername" placeholder="Enter username">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" id="newEmail" placeholder="Enter email">
                        </div>
                        <div class="form-group">
                            <label>Password</label>
                            <input type="password" id="newPassword" placeholder="Enter password">
                        </div>
                        <div class="form-group">
                            <label>Role</label>
                            <select id="newRole">
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn-add" onclick="addUser()">Add User</button>
                </div>
            </div>
        </div>
        
        <div class="footer">
            PhuongVu
        </div>
    </div>

    <script type="module">
        import { auth, db, signInWithEmailAndPassword, createUserWithEmailAndPassword, signOut, onAuthStateChanged, collection, addDoc, getDocs, updateDoc, deleteDoc, doc, query, where } from './firebase-config.js';

        let users = [];
        let currentUser = null;

        // Check if user is logged in and is admin
        function checkAuth() {
            onAuthStateChanged(auth, async (user) => {
                if (!user) {
                    window.location.href = 'login.html';
                } else {
                    currentUser = user;
                    // Check if user is admin by checking Firestore
                    try {
                        const userDoc = await getDocs(query(collection(db, 'users'), where('email', '==', user.email)));
                        if (!userDoc.empty) {
                            const userData = userDoc.docs[0].data();
                            if (userData.role !== 'admin') {
                                alert('Access denied. Admin only.');
                                window.location.href = 'index.html';
                            } else {
                                document.getElementById('username').textContent = userData.username;
                                loadUserList();
                            }
                        } else {
                            // If user doesn't exist in Firestore, create them as admin (first admin)
                            await addDoc(collection(db, 'users'), {
                                username: user.email.split('@')[0], // Use part before @ as username
                                email: user.email,
                                role: 'admin',
                                createdAt: new Date().toISOString()
                            });
                            document.getElementById('username').textContent = user.email.split('@')[0];
                            loadUserList();
                        }
                    } catch (error) {
                        console.error('Error checking user role:', error);
                        alert('Error checking user permissions');
                        window.location.href = 'login.html';
                    }
                }
            });
        }

        // Logout function
        async function logout() {
            try {
                await signOut(auth);
                window.location.href = 'login.html';
            } catch (error) {
                console.error('Logout error:', error);
                alert('Error logging out');
            }
        }

        // Load user list from Firestore
        async function loadUserList() {
            const userList = document.getElementById('userList');
            userList.innerHTML = '';
            
            try {
                const querySnapshot = await getDocs(collection(db, 'users'));
                users = [];
                querySnapshot.forEach((doc) => {
                    users.push({ id: doc.id, ...doc.data() });
                });

                users.forEach((user) => {
                    const userItem = document.createElement('div');
                    userItem.className = 'user-item';
                    userItem.innerHTML = `
                        <div class="user-item-info">
                            <span class="username">${user.username}</span>
                            <span class="role ${user.role}">${user.role}</span>
                        </div>
                        <button class="btn-delete" onclick="window.deleteUser('${user.id}')">Delete</button>
                    `;
                    userList.appendChild(userItem);
                });
            } catch (error) {
                console.error('Error loading users:', error);
                alert('Error loading users');
            }
        }

        // Add new user
        async function addUser() {
            const username = document.getElementById('newUsername').value.trim();
            const email = document.getElementById('newEmail').value.trim();
            const password = document.getElementById('newPassword').value.trim();
            const role = document.getElementById('newRole').value;
            
            if (!username || !email || !password) {
                alert('Please enter username, email and password');
                return;
            }

            try {
                // Check if username already exists
                const existingUser = await getDocs(query(collection(db, 'users'), where('username', '==', username)));
                if (!existingUser.empty) {
                    alert('Username already exists');
                    return;
                }

                // Create Firebase Auth user
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                
                // Add user data to Firestore
                await addDoc(collection(db, 'users'), {
                    username: username,
                    email: email,
                    role: role,
                    createdAt: new Date().toISOString()
                });
                
                // Clear form and reload user list
                document.getElementById('newUsername').value = '';
                document.getElementById('newEmail').value = '';
                document.getElementById('newPassword').value = '';
                loadUserList();
                
                alert('User added successfully');
            } catch (error) {
                console.error('Error adding user:', error);
                if (error.code === 'auth/email-already-in-use') {
                    alert('Email already exists');
                } else if (error.code === 'auth/weak-password') {
                    alert('Password is too weak (minimum 6 characters)');
                } else {
                    alert('Error adding user: ' + error.message);
                }
            }
        }

        // Delete user
        async function deleteUser(userId) {
            try {
                const userDoc = await getDocs(query(collection(db, 'users'), where('email', '==', currentUser.email)));
                if (!userDoc.empty) {
                    const userData = userDoc.docs[0];
                    
                    // Prevent deleting self
                    if (userData.id === userId) {
                        alert('You cannot delete yourself');
                        return;
                    }
                }

                if (confirm('Are you sure you want to delete this user?')) {
                    await deleteDoc(doc(db, 'users', userId));
                    loadUserList();
                    alert('User deleted successfully');
                }
            } catch (error) {
                console.error('Error deleting user:', error);
                alert('Error deleting user');
            }
        }

        // Make functions globally accessible
        window.logout = logout;
        window.addUser = addUser;
        window.deleteUser = deleteUser;

        // Check authentication on page load
        checkAuth();
    </script>
</body>
</html>
